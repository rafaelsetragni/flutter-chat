name: chatpoc
description: Sample chat app using Supabase and Flutter

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.17.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.20.2
  supabase_flutter: ^2.9.1
  timeago: ^3.7.1
  provider: ^6.1.5

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
